<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UMEコンシェルズの下調べ</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#f5f5f7;--card:#ffffff;--ink:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;--accent:#0071e3;
  --warn-bg:#fff4e5;--warn-ink:#8a4b00;--soft:#f2f2f7;--grid-line:#e3e3e8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000;--card:#1c1c1e;--ink:#f5f5f7;--sub:#98989d;--line:#38383a;--accent:#2997ff;
  --warn-bg:#3a2a12;--warn-ink:#ffcc80;--soft:#2c2c2e;--grid-line:#3a3a3c;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px;position:relative}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--sub);font-weight:600}
h1{font-size:26px;line-height:1.3;margin:4px 0 2px;font-weight:700;letter-spacing:-.01em}
.meta{color:var(--sub);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);color:var(--accent);text-decoration:none;font-size:14px;font-weight:600}
.btn svg{width:16px;height:16px}
.status{margin:16px 0 0;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  font-size:14px;color:var(--sub);display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:p 1.2s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
.card{background:var(--card);border-radius:18px;padding:18px 18px 16px;margin-top:14px;border:1px solid var(--line)}
.card h2{font-size:13px;letter-spacing:.06em;color:var(--sub);margin:0 0 8px;font-weight:700}
.card .lead{font-size:18px;font-weight:650;margin:0 0 6px;line-height:1.45}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{padding:9px 0;border-top:1px solid var(--line);font-size:15px}
ul.list li:first-child{border-top:0;padding-top:2px}
.guess{color:var(--sub)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--sub);background:var(--soft);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
/* 出どころの札：原文（問い合わせに書いてある）・AI（ウェブで調べた）・推測（2026-11-13 天田さん） */
.tag.src{color:#1d1d1f;background:#e8e8ed}
.tag.ai{color:#0057b8;background:#e3effd}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.src{color:#f5f5f7;background:#3a3a3c}:root:not([data-theme="light"]) .tag.ai{color:#8ec5ff;background:#0b2a4a}}
.srcl{font-size:12px;font-weight:600;white-space:nowrap;margin-left:4px;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.srcl svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;vertical-align:-1px;margin-right:3px}
.siteurl{font-size:13px;color:var(--sub);word-break:break-all;margin-top:6px}
.body{white-space:pre-wrap;font-size:15px}
.more{color:var(--accent);background:none;border:0;padding:6px 0 0;font-size:14px;font-weight:600;cursor:pointer}
a{color:var(--accent)}
.map{width:100%;height:220px;border:0;border-radius:12px;margin-top:10px;background:var(--soft)}
.sched{width:100%;border-collapse:collapse;font-size:15px}
.sched td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
.sched tr:first-child td{border-top:0}
.sched td.who{width:64px;color:var(--sub);font-weight:600;font-size:14px}
.none{color:var(--sub)}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.warn h2{color:var(--warn-ink)}
/* スケジュール帳（スクショ風） */
.gridbox{margin:12px -18px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
table.g{border-collapse:separate;border-spacing:0;font-size:10px;background:#fff;color:#1d1d1f}
table.g td,table.g th{border-right:1px solid #e3e3e8;border-bottom:1px solid #e3e3e8;height:24px;
  padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
table.g th{background:#f2f2f7;font-weight:700;color:#3a3a3c;position:sticky;top:0}
table.g th.day{font-size:11px;height:26px;text-align:left;padding-left:6px;border-left:2px solid #8e8e93}
/* 開催日：色はスケジュール帳のまま、上にオレンジの線と「開催日」の札（2026-11-14） */
table.g th.day.mid{box-shadow:inset 0 4px 0 #ff9f0a}
.kd{display:inline-block;background:#ff9f0a;color:#1d1d1f;font-size:10px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:6px;line-height:16px}
table.g td.dm{box-shadow:inset 0 0 0 9999px rgba(255,159,10,.08)}
table.g th.h{font-weight:500;color:#8e8e93;text-align:center}
table.g td.dstart,table.g th.dstart{border-left:2px solid #8e8e93}
table.g .st{position:sticky;left:0;z-index:2;background:#fafafa;font-weight:700;white-space:normal;line-height:1.1;font-size:10px;vertical-align:middle;text-align:center;padding:2px 0;overflow:hidden}
table.g .st2{position:sticky;z-index:2;background:#fafafa;color:#6e6e73;border-right:1px solid #c7c7cc;font-size:9px;overflow:hidden;white-space:nowrap;padding:0 2px}
table.g th.st,table.g th.st2{z-index:3;background:#f2f2f7}
.nar table.g td,.nar table.g th{padding:0 1px;font-size:9px}
.nar table.g th.h{font-size:8px;letter-spacing:-.04em}
.nar table.g th.day{padding-left:4px}
.nar .kd{font-size:9px;padding:0 3px;margin-right:4px}
table.g td{overflow:visible;text-overflow:clip}
table.g td .ov{position:relative;z-index:1;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:24px}
table.g td.c .ov{opacity:.55}
table.g tr.gs td{border-top:1px solid #c7c7cc}
.legend{font-size:12px;color:var(--sub);margin-top:8px}
.foot{margin-top:24px;font-size:12px;color:var(--sub);text-align:center}
.empty{padding:60px 0;text-align:center;color:var(--sub)}
/* 対応する人・返信の下書き（2026-11-13） */
.claim{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 0;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px}
.claim .who{color:var(--sub);flex-basis:100%}
/* ボタンは3つを1行に同じ幅で並べる（1つだけ折り返さないように。2026-11-13 天田さん） */
.claim .btns{display:flex;gap:8px;flex-basis:100%}
.claim b{font-weight:700}
.claim button{flex:1 1 0;min-width:0;white-space:nowrap;font:inherit;font-size:14px;font-weight:600;padding:7px 6px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
.claim button.on{background:var(--accent);border-color:var(--accent);color:#fff}
details.draft summary{cursor:pointer;list-style:none;color:var(--accent);font-weight:600;font-size:15px;padding:2px 0}
details.draft summary::-webkit-details-marker{display:none}
details.draft[open] summary{margin-bottom:10px}
.dlabel{font-size:12px;color:var(--sub);font-weight:700;margin:10px 0 4px;display:flex;justify-content:space-between;align-items:center}
.dbox{white-space:pre-wrap;font-size:14px;line-height:1.7;background:var(--soft);border-radius:12px;padding:12px 14px}
.copy{font:inherit;font-size:12px;font-weight:600;color:var(--accent);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.badge{display:inline-block;font-size:12px;font-weight:700;color:var(--warn-ink);background:var(--warn-bg);border-radius:8px;padding:3px 8px;margin-top:8px}
/* 起動の見せ方（2026-11-13 天田さん「ロゴはさりげなく。待たされている感じにしない」）
   小さなロゴ（見出しの上に残る）・上の細い線・中身の形をした灰色の枠（スケルトン）で、開いた直後から動いて見せる。中身が届いたら即切り替え */
.brand{position:absolute;top:22px;right:16px;width:86px;height:60px}
/* ロゴは右上（名前の横）に置く。名前が長くてもロゴに重ならないよう、見出しの右に余白（2026-11-14 天田さん） */
#app>.eyebrow,#app>h1{padding-right:96px}
/* 動画の黒は真っ黒でないので、明るさを寄せてから背景に溶かす（暗い画面は黒を消し、明るい画面は白黒反転して白を消す） */
.brand video,.brand img{height:60px;width:86px;object-fit:contain;display:block;filter:brightness(.85) contrast(1.4);mix-blend-mode:screen}
@media (prefers-color-scheme: light){.brand video,.brand img{filter:invert(1) brightness(1.15) contrast(1.4);mix-blend-mode:multiply}}
/* 読み込み中はロゴを画面のど真ん中（縦も横も）に大きめに出し、中身が届いたら見出しの位置へすっと上がる（2026-11-13 天田さん） */
.brand>*{position:relative;z-index:40;transform-origin:50% 50%}
body.lift .brand>*{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){body.lift .brand>*{transition:none}}
#bar{position:fixed;left:0;top:0;height:2px;width:0;background:var(--accent);z-index:60;transition:width 1.4s cubic-bezier(.1,.7,.3,1),opacity .3s ease .25s}
#bar.go{width:72%}
#bar.done{width:100%;opacity:0;transition:width .25s ease,opacity .3s ease .2s}
.sk{background:linear-gradient(90deg,var(--soft) 30%,var(--line) 50%,var(--soft) 70%);background-size:300% 100%;animation:sh 1.1s linear infinite;border-radius:8px}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.skc{background:var(--card);border-radius:18px;padding:18px;margin-top:14px;border:1px solid var(--line)}
.skl{height:12px;margin:10px 0}
.card{animation:rise .28s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.sk,.card,.dot{animation:none}#bar{transition:none}}
</style>
</head>
<body>
<div id="bar"></div>
<div class="wrap"><div class="brand" aria-hidden="true"><video id="sv" src="splash.mp4" autoplay muted playsinline preload="auto"></video></div><div id="app"></div></div>
<script>
// 出典は、サイト名だけでなくページの場所まで見せる（2026-11-16 天田さん「同じサイトの別のページだと見に行かなくなる」）
function srcLabel(u){var t=String(u||'');try{var x=new URL(t);t=x.hostname.replace(/^www\./,'')+decodeURIComponent(x.pathname).replace(/\/+$/,'');}catch(e){t=t.replace(/^https?:\/\/(www\.)?/,'').replace(/\/+$/,'');}if(t.length>46){var p=t.split('/'),last=p.pop();t=p[0]+'/…/'+(last.length>26?last.slice(0,25)+'…':last);}return t;}

// 外枠はGitHub Pagesに置き、中身は開いたときに天田CRMのウェブアプリから読む（2026-11-13。script.google.com のページは、
// スマホのブラウザが複数のGoogleアカウントでログインしていると開けないため）。お客さまの情報はこのファイルには入れない
var API='https://script.google.com/macros/s/AKfycbyFBvbWpyYCK65ZEjEOobPRoR6LTiweo-Y7nSKA4oukoWPU2LypJCkidOQ60-ETfHv3/exec';
var TOKEN=(location.search.match(/[?&]r=([A-Za-z0-9_-]{20,})/)||[])[1]||'';
var DATA=null;
function load(cb){
  if(!TOKEN){cb(null,true);return;}
  fetch(API+'?rj='+encodeURIComponent(TOKEN),{credentials:'omit'}).then(function(r){return r.json();}).then(function(d){cb(d,false);}).catch(function(){cb(null,false);});
}
var IC = {
  tel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  // スプレッドシートのアイコン（緑の紙に白いマス。2026-11-14 天田さん）
  sheet:'<svg viewBox="0 0 24 24"><path d="M14.5 1.5H6A2 2 0 0 0 4 3.5v17a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z" fill="#0f9d58"/><path d="M14.5 1.5V7H20z" fill="#87ceac"/><path d="M7.5 10.5h9v8h-9z" fill="#fff"/><path d="M7.5 13.2h9M7.5 15.8h9M11 10.5v8" stroke="#0f9d58" stroke-width="1"/></svg>',
  web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>'
};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
// 文字の中のURLをリンクにする。「推測：」は薄く
function rich(s){
  s=String(s==null?'':s);
  var m=s.match(/^(推測|原文|AI)[：:]\s*/),src='';
  // AI調べの項目の最後のURLは、文の中には出さず「出典」の小さなリンクにする（2026-11-13 天田さん）
  if(m&&m[1]==='AI'){var u=s.match(/\s+(https?:\/\/[^\s<>"']+)\s*$/);if(u){s=s.slice(0,u.index);var dm=srcLabel(u[1]);src=' <a class="srcl" href="'+esc(u[1])+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'+esc(dm)+'</a>';}}
  var h=esc(m?s.slice(m[0].length):s).replace(/https?:\/\/[^\s<>"']+/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>';});
  if(m){
    if(m[1]==='推測')h='<span class="tag">推測</span><span class="guess">'+h+'</span>';
    else if(m[1]==='原文')h='<span class="tag src">原文</span>'+h;
    else h='<span class="tag ai">AI調べ</span>'+h+src;
  }
  return h;
}
function list(a){
  a=(a||[]).filter(function(x){return String(x||'').trim();});
  if(!a.length)return '';
  return '<ul class="list">'+a.map(function(x){return '<li>'+rich(x)+'</li>';}).join('')+'</ul>';
}
var n=0,GW=null;
function card(title,inner,cls){if(!inner)return '';n++;return '<section class="card '+(cls||'')+'" style="animation-delay:'+Math.min(n*50,300)+'ms"><h2>'+esc(title)+'</h2>'+inner+'</section>';}
function fallbackCopy(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(a);}
function mapUrl(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);}

// A列の名前（スケジュール帳は縦書きで、名前は大きく白、説明は小さく薄い。字のまとまりごとに大きさと色を合わせる。2026-11-14）
function pt(s){return Math.max(7,Math.round((s||10)*1.25));}
function groupHtml(r){
  if(!r.runs||!r.runs.length)return esc(r.group).replace(/\n/g,'<br>');
  return r.runs.map(function(x){return '<span style="font-size:'+pt(x.s)+'px;font-weight:'+(x.b?700:400)+(x.fc?';color:'+x.fc:'')+'">'+esc(x.t).replace(/\n/g,'<br>')+'</span>';}).join('');
}
// 左上の見出し（スケジュール帳の1・2行目と同じ。1行目はA・B列をつなげて濃い色、2行目はメモ）
function headL(g,lw,mw){var H=g.hdr||{};return '<th class="st" colspan="'+(mw?2:1)+'" style="width:'+(lw+mw)+'px;font-size:8px;line-height:1.15;'+colorStyle(H.bg1,H.fc1)+'">'+esc(H.t1||'リソース').replace(/\n/g,'<br>')+'</th>';}
function headL2(g,lw,mw){var H=g.hdr||{};return '<th class="st" style="width:'+lw+'px;'+colorStyle(H.bgA,H.fcA)+'">'+esc(H.tA||'')+'</th>'+(mw?'<th class="st2" style="left:'+lw+'px;text-align:center;'+colorStyle(H.bgB,H.fcB)+'">'+esc(H.tB||'メモ')+'</th>':'');}
// 本物のシートの色（白・黒は既定の見た目のまま）
function colorStyle(bg,fc){var st=[];if(bg&&bg!=='#ffffff')st.push('background:'+bg);if(fc&&fc!=='#000000')st.push('color:'+fc);return st.join(';');}
function grid(g){
  if(!g)return '';
  if(g.error)return '<p class="none">スケジュール帳を読めませんでした（'+esc(g.error)+'）</p>';
  if(!g.rows||!g.rows.length)return '<p class="none">スケジュール帳に、この日のタブが見つかりませんでした</p>';
  // 列幅は固定（長い文字で列が広がらないように。スプレッドシートと同じく、はみ出た文字は帯の中で切る）
  // スマホ（幅600px未満）は、1日分が1画面に収まるよう列を細くし、メモ列を省く
  var nar=window.innerWidth<600,cw=nar?13:24,F=g.fmt||{},lw=F.wA?Math.max(22,F.wA):64,mw=F.wB?Math.max(30,F.wB):(nar?0:70);
  GW={cw:cw,lw:lw+mw,day:g.hours.length*cw,nar:nar};
  var nc=g.days.length*g.hours.length,cols='<colgroup><col style="width:'+lw+'px">'+(mw?'<col style="width:'+mw+'px">':'');
  for(var i=0;i<nc;i++)cols+='<col style="width:'+cw+'px">';
  cols+='</colgroup>';
  var h='<div class="gridbox'+(nar?' nar':'')+'" id="gb"><table class="g" style="table-layout:fixed;width:'+(lw+mw+nc*cw)+'px">'+cols+'<thead><tr>'+headL(g,lw,mw);
  // 日付の行：スケジュール帳の1行目と同じ色・太さ・寄せ方（平日は紺、土曜は青、日曜・祝日は赤。祝日は見出しに名前が入っている）
  g.days.forEach(function(d,i){var hd=d.hd||{},st=colorStyle(hd.bg,hd.fc)+(hd.h==='center'?';text-align:center;padding-left:0':'')+(hd.b===0?';font-weight:500':'');
    h+='<th class="day'+(i===1?' mid':'')+'" colspan="'+g.hours.length+'"'+(i===1?' id="mid"':'')+' style="'+st+'">'+(i===1?'<span class="kd">開催日</span>':'')+esc(d.label)+(d.found?'':'（タブなし）')+'</th>';});
  h+='</tr><tr>'+headL2(g,lw,mw);
  // 時刻の行：スケジュール帳の2行目と同じ（0・6・12・18時だけ濃い太字）
  g.days.forEach(function(d){g.hours.forEach(function(x,k){var q=d.hrs&&d.hrs[k],st=q?colorStyle(q.bg,q.fc)+(q.b?';font-weight:700':''):'';h+='<th class="h'+(k===0?' dstart':'')+'" style="'+st+'">'+esc(x)+'</th>';});});
  h+='</tr></thead><tbody>';
  // まとまり（A列）は縦にまとめて1回だけ出す
  var spans={},last=null,first=null;
  g.rows.forEach(function(r,i){if(r.gs||r.group!==last||first===null){first=i;spans[i]=1;last=r.group;}else spans[first]++;});
  g.rows.forEach(function(r,i){
    h+='<tr'+(spans[i]?' class="gs"':'')+'>';
    if(spans[i])h+='<td class="st" rowspan="'+spans[i]+'" style="'+colorStyle(r.bgA,r.runs?'':r.fcA)+'">'+groupHtml(r)+'</td>';
    if(mw)h+='<td class="st2" style="left:'+lw+'px;'+colorStyle(r.bgB,r.fcB)+(r.fB&&r.fB.h==='right'?';text-align:right':'')+'">'+esc(r.label)+'</td>';
    // 3日分を1列に並べる（タブが無い日は空マス）
    var all=[],H=g.hours.length;
    r.days.forEach(function(cells){for(var k=0;k<H;k++)all.push(cells&&cells[k]?cells[k]:{t:'',bg:'',fc:'',w:0,m:0,c:0});});
    all.forEach(function(c,k){
      // 色つきのマスは縦の線を消して、帯に見せる（スケジュール帳は枠線なし）
      var st=[];if(c.bg){st.push('background:'+c.bg);if(k%H!==H-1&&all[k+1]&&all[k+1].bg===c.bg)st.push('border-right-color:'+c.bg);}if(c.fc)st.push('color:'+c.fc);
      var inner='';
      if(c.t){
        // 文字の幅：結合なら帯の幅、そうでなければ右の空きマス（結合していない）まではみ出す
        var ext=c.w||1;
        if(!c.w){for(var j=k+1;j<all.length&&!all[j].t&&!all[j].m;j++)ext++;}
        inner='<span class="ov" style="width:'+(ext*GW.cw-3)+'px">'+esc(c.t)+'</span>';
      }
      h+='<td class="'+(k%H===0?'dstart ':'')+(Math.floor(k/H)===1&&!c.bg?'dm ':'')+(c.c?'c':'')+'"'+(st.length?' style="'+st.join(';')+'"':'')+(c.t?' title="'+esc(c.t)+'"':'')+'>'+inner+'</td>';
    });
    h+='</tr>';
  });
  // スケジュール帳へのリンク（当日の月のタブへ。タブのIDは「202611」のように年月。違っても先頭のタブが開くだけ。2026-11-13 天田さん）
  var md=(g.days[1]&&g.days[1].ymd||'').replace(/-/g,'').slice(0,6);
  var su='https://docs.google.com/spreadsheets/d/165lmqNS5fA-z8PxxLwwQfxn7BROop0DPfRKcajtiqMo/edit'+(md?'#gid='+md:'');
  h+='</tbody></table></div><p class="legend">スケジュール帳（RAHU_schedule）の前日・当日・翌日。開くたびに今の内容を読み直します。天田さんの行は出していません。横にスクロールできます</p>'+
    '<div class="actions"><a class="btn" href="'+su+'" target="_blank" rel="noopener">'+IC.sheet+'スケジュール帳を開く</a></div>';
  return h;
}

function render(){
  n=0;
  var app=document.getElementById('app');
  if(!DATA){app.innerHTML='<div class="empty">このページは見つかりませんでした。<br>URLが正しいか確かめてください。</div>';return;}
  var f=DATA.form||{},r=DATA.report||{},done=DATA.status==='完了';
  var h='<div class="eyebrow">UMEコンシェルズによる下調べ</div>';
  h+='<h1>'+esc(f.name||'お名前なし')+(f.name?' さま':'')+'</h1>';
  h+='<div class="meta">'+esc([f.company,DATA.id,f.at?('受信 '+String(f.at).replace(/-/g,'/')):''].filter(Boolean).join('　·　'))+'</div>';
  h+='<div class="actions">';
  if(f.tel)h+='<a class="btn" href="tel:'+esc(String(f.tel).replace(/[^\d+]/g,''))+'">'+IC.tel+esc(f.tel)+'</a>';
  if(f.mail)h+='<a class="btn" href="mailto:'+esc(f.mail)+'">'+IC.mail+'メール</a>';
  // 押すと、天田CRMの案件カードにこの案件を映して（?oc=鍵）、案件カードのタブを開く（2026-11-15 天田さん）
  if(DATA.cardUrl)h+='<a class="btn" id="opencard" href="'+esc(DATA.cardUrl)+'" target="_blank" rel="noopener">'+IC.web+'案件カードを開く</a>';
  h+='</div>';
  // 対応する人（押すとグループに1行知らせる。二重の返信・返し忘れを防ぐ）
  var ow=DATA.owner;
  h+='<div class="claim" id="claim"><span class="who">'+(ow?'<b>'+esc(ow.who)+'さん</b>が対応中（'+esc(ow.at)+'）':'まだ誰も対応していません')+'</span>'+
    '<div class="btns">'+['梅木','畑山','天田'].map(function(w){return '<button data-who="'+w+'"'+(ow&&ow.who===w?' class="on"':'')+'>'+w+(ow&&ow.who===w?'さん対応中':'が対応')+'</button>';}).join('')+'</div></div>';
  if(!done)h+=(DATA.ageMin!=null&&DATA.ageMin>=10)
    ?'<div class="status">下調べは作れませんでした（時間がかかっています）。問い合わせ内容はこのまま見られます。少したってから開き直すと、できていれば表示されます</div>'
    :'<div class="status"><span class="dot"></span>会社・会場・日程の空きを調べています。できしだい、ここに出ます（2〜5分）</div>';
  if(r.salesLike)h+='<div class="badge">営業メールかもしれません'+(r.salesNote?'：'+esc(r.salesNote):'')+'</div>';
  if(r.spam){h+=card('判定','<p class="lead">'+rich(r.spamNote||'営業メールのようです。下調べは省きました。')+'</p>','warn');}
  if(r.raw){h+=card('下調べ','<div class="body">'+rich(r.raw)+'</div>');}
  if(r.summary)h+=card('ひとことで','<p class="lead">'+rich(r.summary)+'</p>');
  // 問い合わせ本文
  var body=String(f.body||'').trim();
  if(body){
    var long=body.length>420;
    h+=card('問い合わせ内容（原文）','<div class="body" id="fb">'+esc(long?body.slice(0,400)+'…':body)+'</div>'+(long?'<button class="more" id="more">続きを読む</button>':''));
  }
  // 会社
  var co=r.company||null;
  if(co&&(co.name||co.lines&&co.lines.length)){
    // 同じ会社だと確信がないときは、名前の下に目印を出す
    var mt=String(co.match||''),unsure=/^確信なし/.test(mt);
    h+=card('会社',(co.name?'<p class="lead">'+esc(co.name)+'</p>':'')+(unsure?'<div class="badge" style="margin:0 0 8px">同じ会社か確信がありません'+(mt.replace(/^確信なし[：:]?\s*/,'')?'：'+esc(mt.replace(/^確信なし[：:]?\s*/,'')):'')+'</div>':'')+list(co.lines)+
      (co.url?'<div class="actions"><a class="btn" href="'+esc(co.url)+'" target="_blank" rel="noopener">'+IC.web+'公式サイト</a></div><div class="siteurl">'+esc(co.url)+'</div>':''));
  }
  // 会場
  var v=r.venue||null;
  if(v&&(v.name||v.address||v.lines&&v.lines.length)){
    var q=v.mapQuery||[v.name,v.address].filter(Boolean).join(' ');
    h+=card('会場',(v.name?'<p class="lead">'+esc(v.name)+'</p>':'')+(v.address?'<div class="meta">'+esc(v.address)+'</div>':'')+list(v.lines)+
      (q?'<iframe class="map" title="地図" src="https://www.google.com/maps?q='+encodeURIComponent(q)+'&output=embed&hl=ja&z=15"></iframe>':'')+
      (q?'<div class="actions"><a class="btn" href="'+mapUrl(q)+'" target="_blank" rel="noopener">'+IC.map+'Googleマップで開く</a></div>':''));
  }
  // 日程と空き
  if(r.dateNote||(r.schedule&&r.schedule.length)||DATA.grid||DATA.gridDate){
    var s=(r.dateNote?'<p class="lead">'+rich(r.dateNote)+'</p>':'');
    if(r.schedule&&r.schedule.length){
      s+='<table class="sched">'+r.schedule.map(function(x){var t=String(x.text||'');return '<tr><td class="who">'+esc(x.who)+'</td><td'+(/^記載なし/.test(t)?' class="none"':'')+'>'+rich(t)+'</td></tr>';}).join('')+'</table>';
    }
    if(r.scheduleExtra)s+='<p class="meta" style="margin:8px 0 0">'+rich(r.scheduleExtra)+'</p>';
    // 表は後から差し込む（中身を先に見せるため。2026-11-13）
    s+='<div id="gridslot">'+(DATA.grid?grid(DATA.grid):(DATA.gridDate?'<div class="sk" style="height:220px;margin-top:12px"></div><p class="legend">スケジュール帳の前日・当日・翌日を読み込んでいます</p>':''))+'</div>';
    h+=card('日程と空き',s);
  }
  if(r.past&&r.past.length)h+=card('過去の取引',list(r.past));
  if(r.concerns&&r.concerns.length)h+=card('気になる点',list(r.concerns),'warn');
  if(r.venuePast&&r.venuePast.length)h+=card('この会場の実績',list(r.venuePast));
  if(r.reply&&r.reply.length||r.draft&&r.draft.body){
    var dr='';
    if(r.draft&&r.draft.body){
      dr='<details class="draft"'+(r.reply&&r.reply.length?' style="margin-top:12px"':'')+'><summary>返信の下書きを見る</summary>'+
        (r.draft.subject?'<div class="dlabel">件名<button class="copy" data-copy="ds">コピー</button></div><div class="dbox" id="ds">'+esc(r.draft.subject)+'</div>':'')+
        '<div class="dlabel">本文<button class="copy" data-copy="db">コピー</button></div><div class="dbox" id="db">'+esc(r.draft.body)+'</div>'+
        '<p class="legend">【担当】は書き換えてから送ってください。署名は各自のメールの署名が付きます</p></details>';
    }
    h+=card('最初の返信の提案',list(r.reply)+dr);
  }
  h+='<p class="legend" style="margin-top:18px">札の見方：<span class="tag src">原文</span>問い合わせに書いてあること　<span class="tag ai">AI調べ</span>AIがウェブで調べたこと　<span class="tag">推測</span>推し量り</p>';
  h+='<div class="foot">UMEコンシェルズ　·　更新 '+esc(DATA.updated||'')+'<br>このページはURLを知っている人だけが開けます。外に共有しないでください</div>';
  app.innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.copy'),function(b){b.onclick=function(){
    var t=document.getElementById(b.getAttribute('data-copy')).textContent,done=function(){b.textContent='コピーしました';setTimeout(function(){b.textContent='コピー';},1500);};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,function(){fallbackCopy(t);done();});else{fallbackCopy(t);done();}
  };});
  Array.prototype.forEach.call(document.querySelectorAll('#claim button'),function(b){b.onclick=function(){
    var w=b.getAttribute('data-who');if(DATA.owner&&DATA.owner.who===w)return;
    if(!confirm(w+'さんが対応することを、グループに知らせます。よろしいですか？'))return;
    b.textContent='知らせています…';
    fetch(API+'?claim='+encodeURIComponent(TOKEN)+'&who='+encodeURIComponent(w),{credentials:'omit'}).then(function(x){return x.json();}).then(function(x){
      if(x&&x.ok){DATA.owner=x.owner;var y=window.scrollY;render();window.scrollTo(0,y);}else{b.textContent='失敗しました';}
    }).catch(function(){b.textContent='失敗しました';});
  };});
  var oc=document.getElementById('opencard');
  if(oc)oc.onclick=function(){try{fetch(API+'?oc='+encodeURIComponent(TOKEN),{credentials:'omit',keepalive:true}).catch(function(){});}catch(e){}};
  var m=document.getElementById('more');
  if(m)m.onclick=function(){document.getElementById('fb').textContent=body;m.remove();};
  scrollGrid();
  if(DATA.gridDate&&!DATA.grid)loadGrid();
}
// 3日分の表は、当日の頭が左の見出しのすぐ右に来るまで横に送る（PCは前日の夕方も少し見せる）
function scrollGrid(){
  var gb=document.getElementById('gb');
  if(gb&&GW){var go=function(){gb.scrollLeft=Math.max(0,GW.day-(GW.nar?0:GW.cw*6));};go();setTimeout(go,60);}
}
var gridLoading=false;
function loadGrid(){
  if(gridLoading)return;gridLoading=true;
  fetch(API+'?rg='+encodeURIComponent(TOKEN),{credentials:'omit'}).then(function(r){return r.json();}).then(function(x){
    DATA.grid=(x&&x.grid)||{error:'表がありません'};
    var slot=document.getElementById('gridslot');
    if(slot){slot.innerHTML=grid(DATA.grid);scrollGrid();}
  }).catch(function(){
    var slot=document.getElementById('gridslot');
    if(slot)slot.innerHTML='<p class="legend">スケジュール帳を読み込めませんでした。開き直すと、もう一度読み込みます</p>';
  }).then(function(){gridLoading=false;});
}
// 開いた直後：中身の形をした灰色の枠と、上の細い線を出す（中身が届いたら即切り替え。待たせない）
function skeleton(){
  var L=function(w,h,m){return '<div class="sk skl" style="width:'+w+';'+(h?'height:'+h+'px;':'')+(m?'margin:'+m:'')+'"></div>';};
  var c=function(lines){return '<div class="skc">'+L('28%',10,'0 0 14px')+lines.map(function(w){return L(w);}).join('')+'</div>';};
  return L('46%',10,'0 0 10px')+L('62%',26,'0 0 10px')+L('54%',12,'0 0 16px')+
    '<div style="display:flex;gap:8px;margin-bottom:4px">'+L('128px',36,'0').replace('border-radius:8px','')+L('84px',36,'0')+'</div>'+
    c(['92%','70%'])+c(['96%','88%','64%','80%'])+c(['50%','76%'])+c(['58%','84%']);
}
// 読み込み中は、真ん中のロゴと上の細い線だけ（灰色の枠は出さない）。ロゴは見出しの位置に置いたまま、画面のど真ん中まで寄せて大きく見せる
document.body.className='loading';
function centerLogo(){
  var el=document.querySelector('.brand>*'),slot=document.querySelector('.brand');
  if(!el||document.body.className!=='loading')return;
  // 右上の置き場所から、画面のど真ん中（縦も横も）まで寄せる。中身が届いたら transform を外して右上へ戻る
  var r=slot.getBoundingClientRect(),dy=window.innerHeight/2-(r.top+r.height/2),dx=window.innerWidth/2-(r.left+r.width/2);
  el.style.transform='translate('+dx+'px,'+dy+'px) scale(1.5)';
}
centerLogo();window.addEventListener('resize',centerLogo);
// 中身が届いたら、ロゴを真ん中から見出しの位置へすっと上げる
function liftLogo(){
  var b=document.body;if(b.className!=='loading')return;
  var el=document.querySelector('.brand>*');
  b.className='lift';
  if(el)requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.transform='none';});});
  setTimeout(function(){b.className='';},560);
}
var bar=document.getElementById('bar');
requestAnimationFrame(function(){requestAnimationFrame(function(){bar.className='go';});});
function barDone(){bar.className='go done';}
// 小さなロゴ：流れなければ（省電力モードなど）最後のコマの静止画にする。途中で中身が届いても止めない
(function(){
  var v=document.getElementById('sv');if(!v)return;
  var still=function(){if(!v.parentNode)return;var i=document.createElement('img');i.src='logo.png';i.alt='';v.parentNode.replaceChild(i,v);i.style.transform=v.style.transform;};
  v.addEventListener('error',still);
  var p=v.play&&v.play();if(p&&p.catch)p.catch(still);
  setTimeout(function(){if(v.paused&&v.currentTime===0)still();},1200);
})();
load(function(d,bad){
  barDone();liftLogo();
  if(!d&&!bad){document.getElementById('app').innerHTML='<div class="empty">読み込めませんでした。<br>電波のよいところで、もう一度開いてください。</div>';return;}
  DATA=d;
  if(DATA&&DATA.form)document.title='UMEコンシェルズの下調べ｜'+(DATA.form.name||DATA.id);
  render();
  // 調べ中なら15秒ごとに見直す（最大20分）
  if(DATA&&DATA.status!=='完了'){
    var tries=0,timer=setInterval(function(){
      if(++tries>80){clearInterval(timer);return;}
      load(function(x){if(x&&x.status==='完了'){clearInterval(timer);DATA=x;render();}});
    },15000);
  }
});
</script>
</body>
